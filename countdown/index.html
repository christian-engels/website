<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<link rel="icon" href="../favicon.ico">
<style>
@font-face { font-family: "Schibsted Grotesk"; src: url("../assets/fonts/schibsted-grotesk.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
/* St Andrews blue (StAndrewsBlue in the slide theme); white on it is 7.8:1.
   No state relies on colour: words, the progress bar and type weight carry it. */
:root { --bg: #00539b; --text: #ffffff; --muted: #d6e3f0; --track: #ffffff40; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Schibsted Grotesk", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
/* Grid on a pinned wrapper, not body: browser extensions inject elements into body,
   which became extra grid rows and pushed everything down (seen in Safari). */
#page {
  position: fixed; inset: 0; overflow: auto;
  display: grid; grid-template-rows: 1fr auto 1fr; gap: 2vh; /* equal outer rows keep main at true centre */
  padding: clamp(16px, 3vw, 40px);
}
header { align-self: start; }
footer { align-self: end; }
header img { display: block; height: clamp(40px, 7vh, 80px); width: auto; }
main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; text-align: center; }
#title { font-size: clamp(1.25rem, 4vw, 3rem); font-weight: 600; outline: none; min-height: 1.2em; min-width: 10em; }
body:not(.running) #title:empty::before { content: "Click to add a title"; opacity: .5; font-weight: 400; }
#clock { font-size: min(22vw, 50vh); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
#label { font-size: clamp(1.1rem, 3.2vw, 2.5rem); color: var(--muted); min-height: 1.3em; }
body.final #label { color: var(--text); font-weight: 700; }
#timeline { width: min(100%, 64rem); }
#track { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
#bar { height: 100%; width: 0; background: var(--text); transition: width .25s linear; }
#times { display: flex; justify-content: space-between; margin-top: .5em; font-size: clamp(.95rem, 2vw, 1.5rem); color: var(--muted); }
form { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; transition: opacity .3s; }
body.running form:not(:hover):not(:focus-within) { opacity: .25; }
input, button { font: inherit; font-size: 1.1rem; padding: .5em .9em; border-radius: 6px; border: 1px solid #ffffff80; background: transparent; color: inherit; }
input { width: 5em; }
button { cursor: pointer; }
#go { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; min-width: 6em; }
footer a { color: var(--muted); }
:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<div id="page">
<header><img src="st-andrews-logo.png" alt="University of St Andrews"></header>
<main>
  <div id="title" contenteditable="true" spellcheck="false" aria-label="Title"></div>
  <div id="clock">50:00</div>
  <div id="label" aria-live="polite"></div>
  <div id="timeline" aria-hidden="true">
    <div id="track"><div id="bar"></div></div>
    <div id="times"><span id="from"></span><span id="to"></span></div>
  </div>
</main>
<footer>
  <form id="controls">
    <label><input id="mins" type="number" min="0" step="any" value="50"> minutes</label>
    <button id="go" type="submit">Start</button>
    <span id="addwrap"><input id="addmins" type="number" step="any" value="5" aria-label="Minutes to add"> <button id="addtime" type="button">Add time</button></span>
    <button id="reset" type="button">Reset</button>
    <button id="full" type="button">Full screen</button>
    <a href="extra-time/">Extra time version</a>
  </form>
</footer>
</div>
<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
if (q.has('m')) $('mins').value = q.get('m');
if (q.has('t')) $('title').textContent = q.get('t');

// Count against a fixed end time, not ticks, so throttled or sleeping tabs stay accurate.
let end = null, due, started, left, tick, lock, added = 0;
const KEY = 'countdown';
const total = () => Math.max(0, +$('mins').value || 0) * 60000 + added;
const clockTime = t => new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

function fmt(ms) {
  const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(s % 60)}` : `${p(m)}:${p(s % 60)}`;
}
console.assert(fmt(3000000) === '50:00' && fmt(5400000) === '1:30:00' && fmt(2999001) === '50:00' && fmt(1) === '00:01');

function render() {
  if (end && end <= Date.now()) stop();
  const ms = end ? end - Date.now() : left;
  const live = end !== null || left < total(); // running, paused or finished
  const cls = document.body.classList;
  cls.toggle('live', live);
  cls.toggle('running', end !== null);
  cls.toggle('final', live && ms <= 300000);
  $('mins').disabled = live; // a stray scroll on the number box must not change a running test
  $('addwrap').hidden = !live;
  $('clock').textContent = document.title = fmt(ms);
  $('label').textContent = !live ? 'Not started yet'
    : ms === 0 ? 'Time is up. Please stop writing.'
    : !end ? 'Paused'
    : ms <= 60000 ? 'Final minute'
    : ms <= 300000 ? 'Final five minutes'
    : 'Time remaining';
  $('bar').style.width = live ? (100 * (1 - ms / total())) + '%' : '0';
  $('from').textContent = live ? 'Started ' + clockTime(started) : '';
  $('to').textContent = (!live ? '' : end ? 'Ends ' + clockTime(end) : ms === 0 ? 'Ended ' + clockTime(due) : 'Ends —')
    + (live && added ? ` · ${+(added / 60000).toFixed(2)} min added` : '');
  $('go').textContent = end ? 'Pause' : live && left ? 'Resume' : 'Start';
  save();
}

// A running or paused test survives closing the browser; nothing else is kept.
function save() {
  try {
    if (end || (left > 0 && left < total())) localStorage.setItem(KEY, JSON.stringify({ mins: $('mins').value, title: $('title').textContent, end, due, started, left, added, at: Date.now() }));
    else localStorage.removeItem(KEY);
  } catch {}
}
function run() {
  tick = setInterval(render, 250);
  navigator.wakeLock?.request('screen').then(l => lock = l).catch(() => {});
}
function start() {
  if (!left) return;
  if (left === total()) started = Date.now();
  end = due = Date.now() + left;
  run();
}
function stop() {
  left = end ? Math.max(0, end - Date.now()) : left;
  end = null;
  clearInterval(tick);
  lock?.release(); lock = null;
}
function reset() { stop(); added = 0; left = total(); render(); }
// Disruption time; a negative entry takes back a mistaken addition, never below none added.
function addTime() {
  const d = Math.max(-added, (+$('addmins').value || 0) * 60000);
  added += d;
  if (end) end += d;
  else left = Math.max(0, left + d);
  render();
}

$('controls').onsubmit = e => { e.preventDefault(); end ? stop() : start(); render(); };
$('reset').onclick = reset;
$('addtime').onclick = addTime;
$('mins').oninput = reset;
$('title').oninput = save;
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.onkeydown = e => {
  if (e.target.isContentEditable || e.target.tagName === 'INPUT') return;
  if (e.key === ' ') { e.preventDefault(); $('go').click(); }
  if (e.key === 'f') $('full').click();
};
// Pick up a test left running or paused within the last 12 hours; if it ran out meanwhile, render shows time up.
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && Date.now() - s.at < 12 * 3600000) { $('mins').value = s.mins; $('title').textContent = s.title; ({ end, due, started, left, added } = s); }
} catch {}
if (left === undefined) reset();
else { if (end > Date.now()) run(); render(); }
</script>
</body>
</html>
